name: Compile and Deploy Multi-Project Suite to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            11-currency-convert/package-lock.json
            12-tictac-game/package-lock.json

      # 💵 ASSET 1: COMPILE THE EMERALD CURRENCY CONVERTER
      - name: Build Currency Converter
        run: |
          cd 11-currency-convert
          npm ci
          npm run build
          cd ..

      # 🕹️ ASSET 2: COMPILE THE CYBERPUNK TIC-TAC-TOE ARENA
      - name: Build Tic-Tac-Toe Game
        run: |
          cd 12-tictac-game
          npm ci
          npm run build
          cd ..

      # 🏗️ INTEGRATION MATRIX: ORCHESTRATE PRODUCTION DISTRIBUTIONS
      - name: Organize Deployment Directory Structure
        run: |
          mkdir -p final-deploy
          # Copies Currency Converter to the absolute root of deployment branch
          cp -r 11-currency-convert/dist/* final-deploy/
          # Safely nests the Tic-Tac-Toe Arcade inside its own isolated sub-folder URL path
          mkdir -p final-deploy/12-tictac-game
          cp -r 12-tictac-game/dist/* final-deploy/12-tictac-game/

      - name: Stream Optimized Assets to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: final-deploy
          branch: gh-pages
