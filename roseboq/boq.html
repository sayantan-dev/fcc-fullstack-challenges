<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My One & Only</title>
    <link rel="stylesheet" href="phase1.css">
    <link rel="stylesheet" href="phase2.css">
    <link rel="stylesheet" href="phase3.css">
</head>
<body class="stage-1" id="globalBody">

    <div class="fx-canvas" id="particleCanvas"></div>

    <!-- PHASE 1: Premium Rose Cover -->
    <div class="interactive-wrapper" id="scene1">
        <div class="gold-card animate-glow">
            <h1 class="premium-gold-text">For the best person in my life</h1>
            <div class="realistic-rose-trigger" id="roseTrigger">
                <div class="core-rose">
                    <div class="p-petal b-1"></div>
                    <div class="p-petal b-2"></div>
                    <div class="p-petal m-1"></div>
                    <div class="p-petal m-2"></div>
                    <div class="p-petal o-1"></div>
                    <div class="p-petal o-2"></div>
                    <div class="p-stem">
                        <div class="p-leaf l-left"></div>
                        <div class="p-leaf l-right"></div>
                    </div>
                </div>
                <span class="click-hint">Click Here</span>
            </div>
        </div>
    </div>

    <!-- PHASE 2: Cosmic Gratitude (With Pure CSS Glowing Bouquet) -->
    <div class="interactive-wrapper hidden" id="scene2">
        <div class="bouquet-card">
            
            <!-- Animated High-Fidelity Multi-Colour CSS Bouquet Canvas -->
            <div class="css-bouquet-container">
                <div class="bouquet-canvas">
                    
                    <!-- Foliage & Wraps backdrop -->
                    <div class="b-wrap-leaf wl-1"></div>
                    <div class="b-wrap-leaf wl-2"></div>
                    <div class="b-ribbon"></div>

                    <!-- Flower 1: Crimson Red Rose (Left) -->
                    <div class="b-rose rose-left">
                        <div class="br-petal red-b1"></div>
                        <div class="br-petal red-b2"></div>
                        <div class="br-petal red-m1"></div>
                        <div class="br-petal red-m2"></div>
                        <div class="br-petal red-o1"></div>
                        <div class="b-stem-s"></div>
                    </div>

                    <!-- Flower 2: Vibrant Gold Rose (Center Top) -->
                    <div class="b-rose rose-center">
                        <div class="br-petal gold-b1"></div>
                        <div class="br-petal gold-b2"></div>
                        <div class="br-petal gold-m1"></div>
                        <div class="br-petal gold-m2"></div>
                        <div class="br-petal gold-o1"></div>
                        <div class="b-stem-s"></div>
                    </div>

                    <!-- Flower 3: Soft Pink Rose (Right) -->
                    <div class="b-rose rose-right">
                        <div class="br-petal pink-b1"></div>
                        <div class="br-petal pink-b2"></div>
                        <div class="br-petal pink-m1"></div>
                        <div class="br-petal pink-m2"></div>
                        <div class="br-petal pink-o1"></div>
                        <div class="b-stem-s"></div>
                    </div>

                </div>
            </div>
            
            <p class="silver-premium-text">
                Thank u Kittu for being in my life and doing everything u have done for me....u are genuinely my one and only best friend forever
            </p>
            
            <button class="glow-btn" id="toStage3Btn">To show how much u mean to me click here</button>
        </div>
    </div>

    <!-- PHASE 3: Deep Galaxy Dimension -->
    <div class="interactive-wrapper hidden" id="scene3">
        <div class="cosmic-container">
            <h2 class="glowing-silver-universe-text">All this universe around us and u are all that matters.</h2>
            <button class="glow-btn special-gold-glow" id="toStage4Btn">For the final show click here</button>
        </div>
    </div>

    <!-- PHASE 4: Core Diamond Artifact -->
    <div class="interactive-wrapper hidden" id="scene4">
        <div class="diamond-artifact-container">
            <div class="glowing-diamond">
                <div class="diamond-top"></div>
                <div class="diamond-bottom"></div>
            </div>
            <h3 class="diamond-caption">You as a person</h3>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
