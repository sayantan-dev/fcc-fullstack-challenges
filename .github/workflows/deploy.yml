name: Compile and Deploy Vite App to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: 11-currency-convert/package-lock.json

      - name: Compile Production Build Assets
        run: |
          cd 11-currency-convert
          npm ci
          npm run build

      - name: Stream Distribution Folder to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: 11-currency-convert/dist
          branch: gh-pages
